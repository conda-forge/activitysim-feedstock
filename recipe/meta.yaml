{% set name = "activitysim" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/activitysim-{{ version }}.tar.gz
  sha256: 2603316524940e1ef32f6f9aec641b4a8df885ac070b263e2d242d4a846f782f

build:
  number: 0
  noarch: python
  entry_points:
    - activitysim=activitysim.cli.main:main
    - activitysim_checksums=activitysim.cli.create:display_sha256_checksums
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=69
    - setuptools-scm >=8.0
    - wheel
  run:
    - cytoolz >=0.8.1
    - multimethod <2.0
    - numba >=0.57
    - numpy >=2.0,<3
    - openmatrix >=0.3.4.1
    - pandas >=2,<3
    - pandera >=0.30
    - platformdirs
    - psutil >=4.1
    - pyarrow >=2.0
    - pydantic >=2.6
    - python >={{ python_min }}
    - pyyaml >=5.1
    - pypyr >=5.3
    - pytables >=3.9
    - requests >=2.7
    - scikit-learn >=1.2
    - setuptools >=80.9.0
    - sharrow >=2.16.0
    - sparse
    - xarray >=2024.05

test:
  imports:
    - activitysim
    - activitysim.abm
  commands:
    - pip check
    - activitysim --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/activitysim/activitysim
  summary: Activity-Based Travel Modeling
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - dhensle
    - i-am-sijia
    - janzill
    - joecastiglione
    - jpn--
